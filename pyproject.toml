[project]
name = "revit-grounded-ai-assistant"
version = "0.1.0"
description = "A small AI assistant core for questions about Revit model revisions: the model words the answer, and every number is checked against a tool result."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sultan179", email = "60371249+sultan179@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
]

[project.urls]
Repository = "https://github.com/sultan179/revit-grounded-ai-assistant"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name is shorter than the project name: `import grounded_assistant`.
module-name = "grounded_assistant"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern syntax, B: likely bugs,
# SIM: simplifications, S: security checks
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest tests use plain `assert`, which the security rule S101 flags.
# S603 and S607 flag every call to `git`; the push check and its tests run git with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The push check lives outside the package, in tools/; its tests import it from there.
pythonpath = ["tools"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
